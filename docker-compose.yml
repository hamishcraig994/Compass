# What's Next - paste this into a Portainer stack (Stacks -> Add stack -> Web editor).
# It uses a pre-built image; see README.md for how to build "whatsnext:latest" first.
# Set PLEX_TOKEN and TMDB_TOKEN under "Environment variables" in the Portainer stack page, so the
# secrets are never written into this file.
services:
  whatsnext:
    image: whatsnext:latest
    container_name: whatsnext
    restart: unless-stopped
    ports:
      - "8091:8080"            # http://<arr-vm-ip>:8091  (8090 = grocery-compare, 8080 = sabnzbd)
    environment:
      - PLEX_URL=http://192.168.1.102:32400
      - PLEX_TOKEN=${PLEX_TOKEN}
      - TMDB_TOKEN=${TMDB_TOKEN}
    volumes:
      - whatsnext_data:/app/data   # TMDB cache + "not interested" list; survives restarts and redeploys
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  whatsnext_data:
