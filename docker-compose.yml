# Compass - paste this into a Portainer stack (Stacks -> Add stack -> Web editor).
# It uses a pre-built image; see README.md for how to build "compass:latest" first.
# PLEX_TOKEN/TMDB_TOKEN below are optional now - the app has a Settings page (open it, go to
# Settings) that saves everything into its own database and applies it immediately, no redeploy
# needed. Leave the environment section out entirely if you'd rather configure it that way; it's
# kept here only as an optional first-boot default (e.g. if you prefer Portainer's own secrets UI).
services:
  compass:
    image: compass:latest
    container_name: compass
    restart: unless-stopped
    ports:
      - "8091:8080"            # http://<arr-vm-ip>:8091  (8090 = grocery-compare, 8080 = sabnzbd)
    environment:
      - PLEX_URL=http://192.168.1.102:32400
      - PLEX_TOKEN=${PLEX_TOKEN}
      - TMDB_TOKEN=${TMDB_TOKEN}
    volumes:
      - compass_data:/app/data   # TMDB cache + "not interested" list; survives restarts and redeploys
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  compass_data:
    # Keep the pre-rename volume name so the existing data (dismissed list, ratings, settings) is reused
    # on redeploy. Compass renames whatsnext.db to compass.db inside it on first start.
    name: whatsnext_data
